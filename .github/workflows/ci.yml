name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Least privilege for quality; pages permissions only on deploy jobs.
permissions:
  contents: read

# Cancel redundant PR runs. Do not cancel master/main pushes — that can interrupt
# an in-flight GitHub Pages deploy and leave the environment stuck until timeout.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Do not set `version` here — package.json `packageManager` already pins pnpm@10.33.0.
      # Setting both makes pnpm/action-setup fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter react-native-multi-selectbox build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:ci

  # Static Expo web demo → GitHub Pages (project site).
  # URL: https://sauzy34.github.io/react-native-multi-selectbox/
  # Enable once: repo Settings → Pages → Build and deployment → Source: GitHub Actions
  #
  # Only master/main: the github-pages environment defaults to “Protected branches only”
  # (or selected branches), which rejects feature branches.
  build-web-demo:
    needs: quality
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Export Expo web (GitHub Pages base path)
        working-directory: apps/example
        env:
          # Project Pages serve under /<repo>/ — required so JS/CSS resolve correctly.
          EXPO_BASE_URL: /react-native-multi-selectbox
        run: pnpm export:web

      # Avoid Jekyll ignoring paths like _expo on some Pages setups.
      - run: touch apps/example/dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/example/dist

  deploy-pages:
    needs: build-web-demo
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Isolate from quality re-runs; never cancel a live Pages deploy.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
      # Required so deploy-pages can download the artifact from build-web-demo.
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
