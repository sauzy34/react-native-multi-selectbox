name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Least privilege for quality; pages permissions only on the pages job.
permissions:
  contents: read

# Cancel redundant PR runs only. Master/main pushes must not cancel an
# in-flight Pages deploy (can leave the github-pages environment stuck).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Do not set `version` here — package.json `packageManager` already pins pnpm@10.33.0.
      # Setting both makes pnpm/action-setup fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter react-native-multi-selectbox build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:ci

  # Static Expo web demo → GitHub Pages (project site).
  # URL: https://sauzy34.github.io/react-native-multi-selectbox/
  # Enable once: repo Settings → Pages → Build and deployment → Source: GitHub Actions
  #
  # Single job for export + upload + deploy so the artifact never has to be
  # resolved across jobs (avoids flaky deploy-pages artifact / queue timeouts).
  # Only master/main: the github-pages environment often restricts to protected branches.
  pages:
    needs: quality
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Export Expo web (GitHub Pages base path)
        working-directory: apps/example
        env:
          # Project Pages serve under /<repo>/ — required so JS/CSS resolve correctly.
          EXPO_BASE_URL: /react-native-multi-selectbox
        run: pnpm export:web

      # Avoid Jekyll ignoring paths like _expo on some Pages setups.
      - run: touch apps/example/dist/.nojekyll

      # Unique name per run/attempt avoids deploy-pages failing with:
      # "Multiple artifacts named github-pages were unexpectedly found"
      # (can happen on re-runs or when a prior upload lingers in the same run).
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/example/dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
